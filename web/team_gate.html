<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Sentinel Scout</title>
<script src="/js/theme.js"></script>
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/theme.css">
<style>
  /* Served in place of any page on a hub that is on the internet, until the
     team passcode has been typed once on this device. A cookie remembers it
     for the event, so a scout sees this once and not again. */
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: var(--page); color: var(--t0); font-family: var(--f-body); }
  form { width: min(340px, calc(100vw - 32px)); display: flex; flex-direction: column; gap: 14px; }
  h1 { margin: 0; font: 800 26px var(--f-body); }
  p { margin: 0; color: var(--t3); font-size: 15px; line-height: 1.45; }
  label { font: 700 13px var(--f-body); color: var(--t4); text-transform: uppercase; letter-spacing: .06em; }
  input { font: 600 22px var(--f-body); padding: 12px 14px; border-radius: 12px;
          border: 1px solid var(--line); background: var(--panel); color: var(--t0); width: 100%;
          box-sizing: border-box; }
  input:focus { outline: 2px solid var(--red-ring); border-color: var(--red); }
  button { font: 800 17px var(--f-body); padding: 14px; border: 0; border-radius: 12px;
           background: var(--red); color: var(--on-red); cursor: pointer; }
  button:disabled { opacity: .6; }
  .err { color: var(--red-alert); min-height: 1.3em; font-weight: 700; }
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>Sentinel Scout</h1>
  <p>Enter the team passcode. You only need to do this once on this device.</p>
  <label for="pin">Passcode</label>
  <input id="pin" name="pin" type="password" autocomplete="current-password"
         autocapitalize="off" autocorrect="off" spellcheck="false" required autofocus>
  <button id="go" type="submit">Continue</button>
  <div class="err" id="err" role="alert"></div>
</form>
<script>
  const f = document.getElementById('f');
  const err = document.getElementById('err');
  const go = document.getElementById('go');
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = '';
    go.disabled = true;
    try {
      const r = await fetch('/api/team/unlock', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin: document.getElementById('pin').value }),
      });
      const j = await r.json().catch(() => ({}));
      if (r.ok && j.ok) { location.reload(); return; }
      err.textContent = j.error || 'That did not work. Try again.';
    } catch {
      err.textContent = 'Could not reach the hub. Check your connection.';
    }
    go.disabled = false;
  });
</script>
</body>
</html>
